name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # contents: write is needed by the content repair steps below, which commit
  # images copied into duplicated entries and the removal of entry folders that
  # Decap leaves behind when an editor deletes a post.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        # Third-party action, so it is pinned to a commit SHA rather than the
        # mutable v3 tag: this job holds contents: write, and a moving tag would
        # let an upstream compromise run new code against that token.
        # To update, resolve the new tag to its commit and change both lines.
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Duplicating a post in the CMS copies its front matter but not its images,
      # so the copy points at files left in the original's folder. Copy them in
      # before pruning, so an original deleted in the same push still has them.
      - name: Copy images for duplicated entries
        run: bash scripts/copy-duplicated-images.sh

      # Deleting a post in the CMS removes only its index.md, so the folder and its
      # uploaded images stay behind and Hugo keeps publishing them. Prune before the
      # build so the orphans never reach the site.
      - name: Prune orphaned entry folders
        run: bash scripts/prune-orphan-bundles.sh

      - name: Commit content repairs
        if: github.ref == 'refs/heads/main'
        run: |
          if [[ -z "$(git status --porcelain content)" ]]; then
            echo "Nothing repaired; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content
          git commit -m "Repair content after CMS edits"
          # Pushes authored by GITHUB_TOKEN do not trigger workflow runs, so this
          # cannot loop. Rebase first in case an editor saved while we were building.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Validate CMS image optimizer
        run: node --test tests/image-optimizer.test.js

      - name: Validate media policy
        run: bash scripts/validate-media.sh

      - name: Validate content paths
        run: bash scripts/validate-entries.sh

      - name: Build
        run: hugo --minify --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
