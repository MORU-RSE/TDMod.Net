backend:
  name: github
  repo: MORU-RSE/TDMod.Net
  branch: main
  base_url: https://tdmod-net-oauth.moru-rse.workers.dev
  auth_endpoint: /auth
  use_graphql: true
  commit_messages:
    create: "Create {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Delete {{collection}}: {{slug}}"
    uploadMedia: "Upload media: {{path}}"
    deleteMedia: "Delete media: {{path}}"

local_backend: true
publish_mode: simple

site_url: https://moru-rse.github.io/TDMod.Net/
display_url: https://moru-rse.github.io/TDMod.Net/

media_folder: static/images/uploads
public_folder: /TDMod.Net/images/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: news
    label: News / Activities
    label_singular: News / Activity
    description: Group announcements, activities, workshops, seminars, and updates.
    folder: content/news
    path: "{{year}}/{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    preview_path: news/{{year}}/{{slug}}/
    filter: { field: entry_type, value: post }
    summary: "{{title}} - {{date}}"
    sortable_fields: ["date", "title", "author"]
    view_groups:
      - label: Year
        field: date
        pattern: \d{4}
    fields:
      - { label: Entry Type, name: entry_type, widget: hidden, default: post }
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { label: Draft, name: draft, widget: boolean, default: true, hint: Leave this on while you are writing. Turn it off to publish to the live site. }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Summary, name: summary, widget: text, required: true, hint: Short text shown on listing pages. }
      - label: Categories
        name: categories
        widget: select
        multiple: true
        required: false
        options: ["News", "Activities", "Events", "Training", "Announcements"]
      - { label: Tags, name: tags, widget: list, required: false, field: { label: Tag, name: tag, widget: string } }
      - label: Cover
        name: cover
        widget: object
        required: false
        collapsed: true
        fields:
          - label: Image
            name: image
            widget: image
            required: false
            choose_url: false
            hint: Upload a JPEG, PNG, or WebP image. It will be resized and converted to WebP automatically (target 500 KB).
            media_library:
              config:
                max_file_size: 1048576
          - { label: Alt Text, name: alt, widget: string, required: false }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

